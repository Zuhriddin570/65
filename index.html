<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="input">
        <div class="div">
            <div>
                <label for="name">Full Name</label>
            <input id="name" type="text" required placeholder="What should we call you?">
            </div>
            <div>
                <label for="email">E-mail</label>
            <input  class="email" id="email" type="email" placeholder="john@doe.com">
            <p class="error">Email is already taken</p>
            </div>
            <div>
                <label for="enter">Enter Password</label>
            <input id="enter" type="password" placeholder="xxxxxxxx"> 
            <i class="fa-solid fa-eye"></i>
            </div> 
            <div>
                <label for="confirm">Confirm Password</label>
            <input id="confirm" type="password" placeholder="xxxxxxxx">
            <i class="fa-solid fa-eye"></i>
            </div>
            <button type="submit">Update Profile</button>
        </div>
        <div class="div2">
            <svg width="120" height="120" viewBox="0 0 120 120">
                <!-- Orqa fon doirasi -->
                <circle cx="60" cy="60" r="50" stroke="#ccd1d9" stroke-width="8" fill="none" />
                
                <!-- Progress doirasi -->
                <circle 
                  cx="60" cy="60" r="50" 
                  stroke="black" stroke-width="8" fill="none"
                  stroke-dasharray="150" stroke-dashoffset="400"
                  stroke-linecap="round"
                />
                
                <!-- Matn (foiz qiymati) -->
                <text x="50%" y="50%" text-anchor="middle" dy=".3em" font-size="20" font-family="Arial">
                  65%
                </text>
              </svg>
              
            <p>Profile Completeness</p>
            <div class="roadmap">
                <p><del>Create Account</del></p>
                <p><del>Update Roadmap Progress</del></p>
                <p><del>Setup Public Profile</del></p>
                <p>Complete your firtst project</p>
                <p>Invite your friends</p>
            </div>
        </div>
    </div>
    <script src="masala.js"></script>
</body>
</html>
